name: E2E

# End-to-end tests (Playwright) against a throwaway server built inside the job: MySQL 5.7, the PHP API, the built web
# app and a mail sink. They never touch "staging" (docs/adr/0020-pruebas-e2e.md).
# Manual only (Actions -> E2E -> Run workflow): the suite is run in the working session before a pull request is
# opened (CLAUDE.md, section 7), because the free plan of GitHub has a monthly limit of CI minutes.
# - "changed" runs only the scenarios added or changed against origin/develop, which is what a pull request brings.
# - "all" runs the whole suite, as the regression of what is in the chosen branch.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Which scenarios to run
        type: choice
        options:
          - all
          - changed
        default: all

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (PHP 8.3, MySQL 5.7)
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # --only-changed compares against origin/develop, so the history must be there.
          fetch-depth: 0

      # Same image and registry as tests.yml (see the note there about Docker Hub limits).
      - name: Start MySQL 5.7
        run: |
          docker run -d --name mysql57 -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=soltec_e2e \
            -e MYSQL_USER=soltec -e MYSQL_PASSWORD=soltec_local \
            mirror.gcr.io/library/mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb > /dev/null
          for attempt in $(seq 1 40); do
            if docker exec mysql57 mysqladmin ping -h 127.0.0.1 -proot --silent; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::MySQL 5.7 did not become ready"
          docker logs mysql57 | tail -30
          exit 1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, gd
          coverage: none
          tools: composer

      - name: Install API dependencies
        working-directory: api
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build the web app
        run: |
          npm ci
          npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Scenarios added or changed
        if: inputs.scenarios == 'changed'
        working-directory: e2e
        run: npx playwright test --only-changed=origin/develop --pass-with-no-tests

      - name: All scenarios
        if: inputs.scenarios == 'all'
        working-directory: e2e
        run: npx playwright test

      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: e2e/test-results/
          retention-days: 7
