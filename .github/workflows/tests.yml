name: Tests

# Runs only as part of the Deploy workflow (every pull request and every push to main), whose checks also show up on
# the pull request. A separate pull_request/push trigger would run the same tests twice.
on:
  workflow_call:

jobs:
  api:
    name: API (PHP 8.3, MySQL 5.7)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      # MySQL runs from a step instead of a service container: GitHub dumps the whole service log at the
      # end of the job, which buries the output of the checks that matter.
      # The image comes from Google's mirror of Docker Hub, pinned by digest: Docker Hub refuses anonymous pulls from
      # the shared GitHub runners once their quota runs out ("toomanyrequests"). The digest is the one of the official
      # mysql:5.7 image, so Docker verifies the content whatever the registry that serves it.
      - name: Start MySQL 5.7
        run: |
          docker run -d --name mysql57 -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=soltec_test \
            -e MYSQL_USER=soltec -e MYSQL_PASSWORD=soltec_local \
            mirror.gcr.io/library/mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb > /dev/null
          for attempt in $(seq 1 40); do
            if docker exec mysql57 mysqladmin ping -h 127.0.0.1 -proot --silent; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::MySQL 5.7 did not become ready"
          docker logs mysql57 | tail -30
          exit 1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, gd
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Code style (phpcs)
        run: composer lint

      - name: Static analysis (phpstan)
        run: composer analyse

      # ContractTest reads the contract joined from contract/openapi.yaml and contract/modules/.
      - name: Set up Node (contract bundle)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Bundle the API contract
        working-directory: .
        run: npm ci --ignore-scripts && npm run contract:bundle

      - name: Tests (phpunit)
        run: composer test

  web:
    name: Web and shared (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint, prettier)
        run: npm run lint

      - name: Lint the API contract
        run: npm run lint:contract

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
