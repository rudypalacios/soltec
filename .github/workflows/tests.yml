name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  api:
    name: API (PHP 8.3, MySQL 5.7)
    runs-on: ubuntu-latest
    services:
      mysql:
        # Same engine as the hosting (ADR-0001): MySQL 5.7.
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: soltec_test
          MYSQL_USER: soltec
          MYSQL_PASSWORD: soltec_local
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, gd
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Code style (phpcs)
        run: composer lint

      - name: Static analysis (phpstan)
        run: composer analyse

      - name: Tests (phpunit)
        run: composer test

  web:
    name: Web and shared (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint, prettier)
        run: npm run lint

      - name: Lint the API contract
        run: npm run lint:contract

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
