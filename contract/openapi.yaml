openapi: 3.1.0
info:
  title: Soltec API
  version: 1.0.0
  description:
    'Contract of the Soltec CRM-ERP API. It is the single source of truth: the TypeScript types and the
    typed client are generated from it, and a test fails when a route is missing here or listed here without a route.
    Deployment endpoints (/system) are not part of the public contract.


    Conventions:

    - Every operation declares its access rule in `x-permission`: `public` (no session), `authenticated` (any user
    with a session), `internal` (a session of an internal user, for the options lists) or `<resource>.<action>` (for example `users.view`). A route without it fails a test (ADR-0012).
    A session with a restricted token (password change pending) only reaches operations marked `x-allows-restricted-token`.
    An operation marked `x-planned: true` is specified but not implemented yet; the flag is removed in the pull
    request that adds its route.

    - Errors are `application/problem+json` with a stable English `code`; the web app maps it to Spanish.

    - Records that can be edited carry `version`. An update sends the version it read; a stale one answers 409 `conflict`.

    - Nothing is deleted: `deactivate` and `reactivate` change `is_active`. Lists hide inactive records unless `status`
    says otherwise.

    - Ids are UUID strings; timestamps are UTC ISO 8601 with milliseconds.

    - Scope: only the slices already being built. Each slice adds its own operations (see TODO.md).'
servers:
  - url: /api
    description: Same origin as the web app.
security:
  - bearerAuth: []
tags:
  - name: System
    description: Service status.
  - name: Auth
    description: Login, token refresh, password change, invitations and password recovery.
  - name: Me
    description: The signed-in user and their own devices.
  - name: Dashboard
    description: The widgets of the home screen and the catalog a role is assigned from.
  - name: Audit
    description: Read-only access to the audit log.
  - name: Users
    description: Internal user accounts.
  - name: Roles
    description: Roles (perfiles) with their permission matrix and data scopes.
  - name: Departments
    description: Departments of the organization. The direct manager of each user lives in the user.
  - name: Catalog parameters
    description: Lookup lists that other sections draw their options from (contact types, client statuses, segments, tax regimes, payment methods).
  - name: Catalog structure
    description: Brands, areas, product groups, unit categories and units of measure that classify the products.
  - name: Contacts
    description: People that advisers keep, each owned by the user who entered it.
  - name: Products
    description: Products with their cost; the price is derived from it and never stored.
  - name: Bundles
    description: Bundles of products with a quantity each; their cost and price are derived from the components and never stored.
  - name: Clients
    description: Prospects and customers with their advisers, billing profile and linked people, scoped by adviser.
  - name: Suppliers
    description: Suppliers with their addresses and their own people, shared by everyone who may see the section.
  - name: Settings
    description: Company data and logo, tax rates, and the numbering of documents.
  - name: Margin levels
    description: Margin levels (MC) and the catalog price function computed from them.
  - name: Access catalogs
    description: Read-only lists used to build the permission matrix.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description:
        Access token (about 15 minutes). Carries only the user id and the device id; permissions are
        read from the database.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: q
      in: query
      required: false
      description: Free text matched against the name (and the email for users).
      schema:
        type: string
        maxLength: 100
    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - active
          - inactive
          - all
        default: active
  responses:
    Unauthorized:
      description: No valid session (`token_invalid`, `token_expired`) or wrong credentials (`invalid_credentials`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description:
        The user lacks the permission (`forbidden`), or the session is restricted until the password
        is changed (`password_change_required`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such record, or it is outside the caller's data scope (never revealed which).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description:
        A stale version (`conflict`) or a rule that blocks the change (`last_admin`, `invitation_not_pending`, `system_role_immutable`,
        `department_in_use`, `default_margin_level`, `area_in_use`, `unit_category_in_use`,
        `identification_taken`, `identification_inactive`, `user_has_clients`, `margin_level_in_use`, `prospect_single_seller`,
        `responsible_required`, `already_customer`, `client_inactive`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Invalid input. `errors` lists each field with a stable code.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    ServiceUnavailable:
      description: The service is not configured (`auth_not_configured`, `mail_not_configured`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unexpected:
      description: Unexpected error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    RecordMeta:
      type: object
      required:
        - id
        - created_at
        - updated_at
        - version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          minimum: 1
          description: Incremented on every change. Send it back when updating.
    PageMeta:
      type: object
      required:
        - page
        - per_page
        - total
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    Version:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
          description: The version that was read.
    UserType:
      type: string
      enum:
        - internal
        - external
    DataScope:
      type: string
      description:
        Which rows of a resource the user reaches. `team` covers the user, everybody under them through the direct
        manager (directly or not) and the members of their department. `client` is only for external roles, and the
        only scope they can have.
      enum:
        - own
        - team
        - all
        - client
    PermissionMap:
      type: object
      description: Permission codes (view, create, edit, deactivate, approve…) by resource code.
      additionalProperties:
        type: array
        uniqueItems: true
        items:
          type: string
          maxLength: 50
    ScopeMap:
      type: object
      description: Data scope by resource code. A resource without an entry is `own`.
      additionalProperties:
        $ref: '#/components/schemas/DataScope'
    ErrorCode:
      type: string
      description: Stable identifier; the web app maps each one to Spanish text.
      enum:
        - invalid_credentials
        - password_change_required
        - token_expired
        - token_invalid
        - forbidden
        - not_found
        - validation_failed
        - conflict
        - last_admin
        - system_role_immutable
        - department_in_use
        - area_in_use
        - unit_category_in_use
        - default_margin_level
        - auth_not_configured
    Problem:
      type: object
      description:
        RFC 9457 problem details. "code" is a stable identifier in English; the web app maps it to Spanish
        text.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
        active_user_count:
          type: integer
          description: With `department_in_use`, how many active users the department still has.
        active_group_count:
          type: integer
          description: With `area_in_use`, how many active product groups the area still has.
        active_unit_count:
          type: integer
          description: With `unit_category_in_use`, how many active units the category still has.
        password_min_length:
          type: integer
          description: With a field error on a password, the minimum length the company requires.
    FieldError:
      type: object
      required:
        - field
        - code
      properties:
        field:
          type: string
          description: JSON path of the field, for example `role_ids` or `rate`.
        code:
          type: string
          description:
            Stable code such as `required`, `invalid`, `too_short`, `too_long`, `taken`, `not_found`,
            `out_of_range`, `too_large` and `unsupported_type` (an uploaded image), `locked` (a period that can no longer change), `too_low` (a counter that would go down), `current_password_incorrect`, `cycle` (a manager who reports to the user), `out_of_scope` (the
            user would end up outside the caller's data scope).
        message:
          type: string
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - errors
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
    RoleRef:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          type:
            - string
            - 'null'
          description: Only for system roles (`admin`, `external_client`).
        name:
          type: string
    Me:
      type: object
      required:
        - id
        - type
        - name
        - email
        - roles
        - permissions
        - scopes
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/UserType'
        name:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        permissions:
          $ref: '#/components/schemas/PermissionMap'
        scopes:
          $ref: '#/components/schemas/ScopeMap'
    Rate:
      type: string
      pattern: '^0\.\d{5}$'
      description: A rate from 0 up to (not including) 1, as a string so no float is involved. "0.12000" is 12 %.
    WidgetCode:
      type: string
      description: A widget of the home screen. The web app has a component for each one.
      enum:
        - quick_links
        - quick_create_client
        - service_status
