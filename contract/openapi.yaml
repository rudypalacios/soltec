    patch:
      operationId: updateCompany
      summary: Update the company data.
      description: >-
        Changes are audited. A stale version answers 409 `conflict`. `logo_path` is read-only until the
        files module (Hito 3) can upload the logo.
      tags: [Settings]
      x-permission: company.edit
