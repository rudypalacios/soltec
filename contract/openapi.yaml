openapi: 3.1.0
info:
  title: Soltec API
  version: 1.0.0
  description: >-
    Contract of the Soltec CRM-ERP API. It is the single source of truth: the TypeScript types and the
    typed client are generated from it, and a test fails when a route is missing here or listed here
    without a route. Deployment endpoints (/system) are not part of the public contract.


    Conventions:

    - Every operation declares its access rule in `x-permission`: `public` (no session), `authenticated`
    (any user with a session) or `<resource>.<action>` (for example `users.view`). A route without it
    fails a test (ADR-0012). A session with a restricted token (password change pending) only reaches
    operations marked `x-allows-restricted-token`. An operation marked `x-planned: true` is specified but
    not implemented yet; the flag is removed in the pull request that adds its route.

    - Errors are `application/problem+json` with a stable English `code`; the web app maps it to Spanish.

    - Records that can be edited carry `version`. An update sends the version it read; a stale one answers
    409 `conflict`.

    - Nothing is deleted: `deactivate` and `reactivate` change `is_active`. Lists hide inactive records
    unless `status` says otherwise.

    - Ids are UUID strings; timestamps are UTC ISO 8601 with milliseconds.

    - Scope of this version: Hito 1 (Fundaciones). Hitos 2 and 3 are added when each one is planned and its
    columns are defined.
servers:
  - url: /api
    description: Same origin as the web app.
security:
  - bearerAuth: []
tags:
  - name: System
    description: Service status.
  - name: Auth
    description: Login, token refresh, password recovery and invitations.
  - name: Me
    description: The signed-in user and their own devices.
  - name: Users
    description: Internal and external user accounts.
  - name: Roles
    description: Roles (perfiles) with their permission matrix, data scopes and dashboard widgets.
  - name: Access catalogs
    description: Read-only lists used to build the permission matrix.
  - name: Departments
    description: Organization units.
  - name: Settings
    description: Company data and one-row settings by topic (ADR-0016).
  - name: Sequences
    description: Concurrency-safe numbering.
  - name: Margin levels
    description: Contribution margin levels used by the price function (ADR-0011).
  - name: Audit
    description: Append-only change log.
  - name: Dashboard
    description: Widgets the user sees.
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Check that the API and its database answer.
      description: Public and free of internal detail. Used by the deployment smoke test and by monitoring.
      tags: [System]
      x-permission: public
      security: []
      responses:
        '200':
          description: The API and its database answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The API answers but the database does not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Unexpected'

  # ---------------------------------------------------------------- Auth
  /v1/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password.
      description: >-
        Returns a short-lived access token (about 15 minutes) and the user with their effective permissions.
        On the web the refresh token travels in an httpOnly cookie scoped to /api/v1/auth; on mobile it is
        returned in the body (`refresh_token`) for secure storage. Wrong email, wrong password and a locked
        account all answer the same 401 `invalid_credentials`. If the password expired or must be changed,
        the call succeeds with `password_change_required: true` and a restricted token that only works on
        POST /v1/auth/password/change. Answers 503 `auth_not_configured` when the server has no JWT secret.
      tags: [Auth]
      x-permission: public
      x-planned: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: Refresh token cookie (web only). httpOnly, Secure, SameSite=Strict, Path=/api/v1/auth.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate the refresh token and get a new access token.
      description: >-
        The refresh token comes from the cookie (web) or from the body (mobile). Each refresh issues a new
        refresh token and revokes the previous one. Presenting a token that was already revoked revokes every
        token of that device (suspected theft), apart from a short grace window that covers two tabs
        refreshing at once. Answers 401 `token_invalid` or `token_expired`.
      tags: [Auth]
      x-permission: public
      x-planned: true
      security: []
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          description: Refresh token (web).
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens.
          headers:
            Set-Cookie:
              description: Rotated refresh token cookie (web only).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out of the current device.
      description: Revokes the current device and all its refresh tokens, and clears the cookie.
      tags: [Auth]
      x-permission: authenticated
      x-planned: true
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/password/forgot:
    post:
      operationId: requestPasswordReset
      summary: Ask for a password recovery email.
      description: >-
        Always answers 202, whether or not the account exists. If it does, a one-hour, single-use link built
        from the server's APP_URL is emailed after responding; at most one email per minute per account.
      tags: [Auth]
      x-permission: public
      x-planned: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Accepted.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password with a recovery token.
      description: >-
        The token is single use even under simultaneous requests. Success clears the lockout and revokes
        every refresh token of the user. Answers 400 `token_invalid` or `token_expired`, and 422 when the
        password breaks the policy.
      tags: [Auth]
      x-permission: public
      x-planned: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/password/change:
    post:
      operationId: changePassword
      summary: Change the password of the signed-in user.
      description: >-
        Requires the current password. Works with a restricted token, which is how an expired or initial
        password gets replaced. The new password must follow the policy (minimum length from the security
        settings, at most 72 bytes, different from the email). A wrong current password answers 422 with the
        field error `current_password_incorrect`.
      tags: [Auth]
      x-permission: authenticated
      x-planned: true
      x-allows-restricted-token: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation by setting a password.
      description: >-
        For external users created by staff. The token is single use. Answers 400 `token_invalid` or
        `token_expired`, and 422 when the password breaks the policy.
      tags: [Auth]
      x-permission: public
      x-planned: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '204':
          description: Password set; the user can sign in.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'

  # ------------------------------------------------------------------ Me
  /v1/me:
    get:
      operationId: getMe
      summary: Get the signed-in user with roles, effective permissions and scopes.
      description: >-
        Permissions are the union of all the user's roles, read from the database on every request, so a
        role change applies at the next call. With several roles the widest scope wins (all, then team, then
        own). The web app uses it to hide menus; the server is the real control. With a restricted token it
        answers 403 `password_change_required`.
      tags: [Me]
      x-permission: authenticated
      x-planned: true
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/me/devices:
    get:
      operationId: listMyDevices
      summary: List the devices where the signed-in user has an open session.
      description: Revoked devices are not listed.
      tags: [Me]
      x-permission: authenticated
      x-planned: true
      responses:
        '200':
          description: The devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/me/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    delete:
      operationId: revokeMyDevice
      summary: Close the session on one of the user's own devices.
      description: >-
        Revokes the device and all its refresh tokens. The access token of that device stops working at the
        next request. A device that is not the caller's answers 404.
      tags: [Me]
      x-permission: authenticated
      x-planned: true
      responses:
        '204':
          description: Device revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'

  # --------------------------------------------------------------- Users
  /v1/users:
    get:
      operationId: listUsers
      summary: List users.
      description: Filtered by the caller's data scope on `users`. Inactive users are hidden unless status says otherwise.
      tags: [Users]
      x-permission: users.view
      x-planned: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/StatusFilter'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserType'
        - name: department_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: role_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
    post:
      operationId: createUser
      summary: Create a user.
      description: >-
        An internal user needs a department and an `initial_password`; the account is created with
        `must_change_password` true. An external user needs a `client_id`, only external roles and no
        password: an invitation email is sent so the person sets their own. Email must be unique among
        active users. Only an administrator can give the `admin` role. Role ids are checked against
        existing roles of the right user type.
      tags: [Users]
      x-permission: users.create
      x-planned: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUser
      summary: Get a user by id.
      description: An id outside the caller's data scope answers 404, not 403.
      tags: [Users]
      x-permission: users.view
      x-planned: true
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      operationId: updateUser
      summary: Update a user.
      description: >-
        Changes only the fields sent. `type` and `client_id` cannot change. `manager_id` cannot be the user
        or create a cycle. Only an administrator can give or take the `admin` role or edit another
        administrator. Nobody can change their own roles. Taking `admin` from the only active administrator
        answers 409 `last_admin`. A stale version answers 409 `conflict`.
      tags: [Users]
      x-permission: users.edit
      x-planned: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/users/{userId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: deactivateUser
      summary: Deactivate a user.
      description: >-
        Logical deactivation; revokes every session of the user. Nobody can deactivate themselves (403
        `forbidden`). The last active administrator cannot be deactivated (409 `last_admin`). Idempotent.
      tags: [Users]
      x-permission: users.deactivate
      x-planned: true
      responses:
        '200':
          description: The deactivated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/users/{userId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: reactivateUser
      summary: Reactivate a user.
      description: >-
        Fails with 422 `validation_failed` if the email is now used by an active user. The user must sign in
        again. Idempotent.
      tags: [Users]
      x-permission: users.deactivate
      x-planned: true
      responses:
        '200':
          description: The reactivated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/users/{userId}/invite:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: inviteUser
      summary: Send or resend the invitation email.
      description: >-
        Only for a user who has not set a password yet. Invalidates earlier invitation links. The email goes
        out after responding.
      tags: [Users]
      x-permission: users.edit
      x-planned: true
      responses:
        '202':
          description: Accepted; the email is on its way.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/users/{userId}/unlock:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: unlockUser
      summary: Remove the lockout after failed login attempts.
      description: Manual unlock; sets the failed-attempt counter to zero. Idempotent.
      tags: [Users]
      x-permission: users.edit
      x-planned: true
      responses:
        '200':
          description: The unlocked user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'

  # --------------------------------------------------------------- Roles
  /v1/roles:
    get:
      operationId: listRoles
      summary: List roles.
      description: Returns a page of roles with their permission matrix, data scopes and widgets.
      tags: [Roles]
      x-permission: roles.view
      x-planned: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/StatusFilter'
        - name: user_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserType'
      responses:
        '200':
          description: A page of roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
    post:
      operationId: createRole
      summary: Create a role.
      description: >-
        Business roles (P5) are created here by an administrator; only `admin` and `external_client` are
        seeded. The matrix is checked: permission and resource codes must exist, an external role only gets
        `view` and the `client` scope, an internal role never gets `client`. Widget codes are validated
        against the widget registry of `shared/`. Granting permissions on `users` and `roles` is close to
        making someone an administrator.
      tags: [Roles]
      x-permission: roles.create
      x-planned: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    get:
      operationId: getRole
      summary: Get a role with its matrix.
      description: Returns the role with its full matrix, active or not.
      tags: [Roles]
      x-permission: roles.view
      x-planned: true
      responses:
        '200':
          description: The role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      operationId: updateRole
      summary: Update a role.
      description: >-
        `permissions`, `scopes` and `widgets`, when sent, replace the whole set. `user_type` cannot change.
        System roles (`is_system`) cannot be edited: 409 `system_role_immutable`. A change applies to every
        holder of the role at their next request. A stale version answers 409 `conflict`.
      tags: [Roles]
      x-permission: roles.edit
      x-planned: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: The updated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/roles/{roleId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    post:
      operationId: deactivateRole
      summary: Deactivate a role.
      description: >-
        System roles cannot be deactivated (409 `system_role_immutable`). A role still assigned to active
        users answers 409 `conflict`. Idempotent.
      tags: [Roles]
      x-permission: roles.deactivate
      x-planned: true
      responses:
        '200':
          description: The deactivated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/roles/{roleId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    post:
      operationId: reactivateRole
      summary: Reactivate a role.
      description: Fails with 422 `validation_failed` if the name is now used by an active role. Idempotent.
      tags: [Roles]
      x-permission: roles.deactivate
      x-planned: true
      responses:
        '200':
          description: The reactivated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/resources:
    get:
      operationId: listResources
      summary: List the protected resources (one per module).
      description: System table seeded by migrations; read-only.
      tags: [Access catalogs]
      x-permission: roles.view
      x-planned: true
      responses:
