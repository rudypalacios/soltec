        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/financial-settings:
    get:
      operationId: getFinancialSettings
      summary: Get the financial settings (currency, VAT, income tax, stale cost days, quote validity).
      description: Single row. Rates are exact decimal strings; money never travels as a float.
      tags: [Settings]
      x-permission: financial_settings.view
      x-planned: true
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      operationId: updateFinancialSettings
      summary: Update the financial settings.
      description: >-
        Changing VAT or income tax changes every catalog price at once and never alters issued quotes
        (ADR-0011). Rates must satisfy 0 ≤ rate < 1. Audited. A stale version answers 409 `conflict`.
      tags: [Settings]
      x-permission: financial_settings.edit
      x-planned: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialSettingsUpdate'
      responses:
        '200':
          description: The updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
