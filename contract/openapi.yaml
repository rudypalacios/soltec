      tags: [Margin levels]
      x-permission: margin_levels.view
      x-planned: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: A page of margin levels, ordered by `sort_order`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginLevelPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
    post:
      operationId: createMarginLevel
      summary: Create a margin level.
      description: >-
        `rate` must satisfy 0 ≤ rate < 1. The name is unique among active levels. Sending `is_default: true`
        makes it the only default, atomically.
      tags: [Margin levels]
      x-permission: margin_levels.create
      x-planned: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarginLevelCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginLevel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/margin-levels/{marginLevelId}:
    parameters:
      - $ref: '#/components/parameters/MarginLevelId'
    get:
      operationId: getMarginLevel
      summary: Get a margin level by id.
      description: Returns the margin level, active or not.
      tags: [Margin levels]
      x-permission: margin_levels.view
      x-planned: true
      responses:
        '200':
          description: The margin level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginLevel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      operationId: updateMarginLevel
      summary: Update a margin level.
      description: >-
        Changing `rate` changes catalog prices at once and never alters issued quotes (ADR-0011). Setting
        `is_default: true` moves the default to this level; the default cannot be unset directly, only by
        choosing another one. A stale version answers 409 `conflict`.
      tags: [Margin levels]
      x-permission: margin_levels.edit
      x-planned: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarginLevelUpdate'
      responses:
        '200':
          description: The updated margin level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginLevel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/margin-levels/{marginLevelId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/MarginLevelId'
    post:
      operationId: deactivateMarginLevel
      summary: Deactivate a margin level.
      description: The default level cannot be deactivated while it is the default (409 `default_margin_level`). Idempotent.
      tags: [Margin levels]
      x-permission: margin_levels.deactivate
      x-planned: true
      responses:
        '200':
          description: The deactivated margin level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginLevel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/margin-levels/{marginLevelId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/MarginLevelId'
    post:
      operationId: reactivateMarginLevel
      summary: Reactivate a margin level.
      description: Fails with 422 `validation_failed` if the name is now used by an active level. Idempotent.
      tags: [Margin levels]
      x-permission: margin_levels.deactivate
      x-planned: true
      responses:
        '200':
          description: The reactivated margin level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginLevel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'

  # --------------------------------------------------------------- Audit
  /v1/audit-logs:
    get:
      operationId: listAuditLogs
      summary: Search the audit log.
      description: >-
        Read-only and append-only: entries are never edited or deleted. Newest first. Values never include
        passwords or tokens.
      tags: [Audit]
      x-permission: audit_logs.view
      x-planned: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: entity_type
          in: query
          required: false
          description: Table name, for example `users`.
          schema:
            type: string
            maxLength: 50
        - name: entity_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: user_id
          in: query
          required: false
          description: The actor.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: action
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
        - name: from
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: to
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Timestamp'
      responses:
        '200':
          description: A page of entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'

  # ----------------------------------------------------------- Dashboard
  /v1/dashboard:
    get:
      operationId: getDashboard
      summary: Get the widgets the signed-in user sees, in order.
      description: >-
        Union of the widgets of the user's roles, without duplicates. The widget catalog is code in
        `shared/`; the API only says which codes apply.
      tags: [Dashboard]
      x-permission: dashboard.view
      x-planned: true
      responses:
        '200':
          description: The dashboard layout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (about 15 minutes). Carries only the user id and the device id; permissions are read from the database.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: q
      in: query
      required: false
      description: Free text matched against the name (and the email for users).
      schema:
        type: string
        maxLength: 100
    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, inactive, all]
        default: active
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MarginLevelId:
      name: marginLevelId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SequenceCode:
      name: sequenceCode
      in: path
      required: true
      description: Natural key, for example `project`, `quote`, `purchase_order`.
      schema:
        type: string
        maxLength: 50
  responses:
    BadRequest:
      description: The request cannot be processed (for example an invalid or expired one-time token).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No valid session (`token_invalid`, `token_expired`) or wrong credentials (`invalid_credentials`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        The user lacks the permission (`forbidden`), or the session is restricted until the password is
        changed (`password_change_required`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such record, or it is outside the caller's data scope (never revealed which).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >-
        A stale version (`conflict`) or a rule that blocks the change (`last_admin`,
        `system_role_immutable`, `default_margin_level`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Invalid input. `errors` lists each field with a stable code.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    ServiceUnavailable:
      description: The service is not configured (`auth_not_configured`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unexpected:
      description: Unexpected error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    # ---- Shared building blocks
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    RecordMeta:
      type: object
      required: [id, created_at, updated_at, version]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          minimum: 1
          description: Incremented on every change. Send it back when updating.
    PageMeta:
      type: object
      required: [page, per_page, total]
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version that was read.
    UserType:
      type: string
      enum: [internal, external]
    DataScope:
      type: string
      description: >-
        Which rows of a resource the user reaches. `client` is only for external roles, and the only scope
        they can have.
      enum: [own, team, all, client]
    PermissionMap:
      type: object
      description: Permission codes (view, create, edit, deactivate, approve…) by resource code.
      additionalProperties:
        type: array
        uniqueItems: true
        items:
          type: string
          maxLength: 50
    ScopeMap:
      type: object
      description: Data scope by resource code. A resource without an entry is `own`.
      additionalProperties:
        $ref: '#/components/schemas/DataScope'
    CatalogItem:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    CatalogItemList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: string
              enum: [ok, error]

    # ---- Errors
    ErrorCode:
      type: string
      description: Stable identifier; the web app maps each one to Spanish text.
      enum:
        - invalid_credentials
        - password_change_required
        - token_expired
        - token_invalid
        - forbidden
        - not_found
        - validation_failed
        - conflict
        - last_admin
        - system_role_immutable
        - default_margin_level
        - auth_not_configured
    Problem:
      type: object
      description: RFC 9457 problem details. "code" is a stable identifier in English; the web app maps it to Spanish text.
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: JSON path of the field, for example `role_ids` or `rate`.
        code:
          type: string
          description: >-
            Stable code such as `required`, `invalid`, `too_short`, `too_long`, `taken`, `not_found`,
            `out_of_range`, `current_password_incorrect`.
        message:
          type: string
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'

    # ---- Auth
    DeviceInfo:
      type: object
      required: [platform]
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Id returned by an earlier login on this device; omit on the first login.
        platform:
          type: string
          enum: [web, android, ios]
        name:
          type: string
          maxLength: 100
          description: Text that helps the user recognize the device.
    LoginRequest:
      type: object
      required: [email, password, device]
      properties:
        email:
          type: string
          format: email
          maxLength: 190
        password:
          type: string
          maxLength: 72
          writeOnly: true
        device:
          $ref: '#/components/schemas/DeviceInfo'
    RefreshRequest:
      type: object
      description: Mobile only. On the web the refresh token comes from the cookie and the body is empty.
      properties:
        refresh_token:
          type: string
          writeOnly: true
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, password_change_required]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the access token expires.
        password_change_required:
          type: boolean
          description: True when the token is restricted to POST /v1/auth/password/change.
        refresh_token:
          type: string
          description: Present only when the client is not a web browser (mobile); the web gets a cookie.
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/TokenResponse'
        - type: object
          required: [device_id, user]
          properties:
            device_id:
              $ref: '#/components/schemas/Uuid'
            user:
              $ref: '#/components/schemas/Me'
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 190
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
          writeOnly: true
        new_password:
          type: string
          maxLength: 72
          writeOnly: true
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          maxLength: 72
          writeOnly: true
        new_password:
          type: string
          maxLength: 72
          writeOnly: true
    AcceptInvitationRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          writeOnly: true
        password:
          type: string
          maxLength: 72
          writeOnly: true

    # ---- Me and devices
    RoleRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: [string, 'null']
          description: Only for system roles (`admin`, `external_client`).
        name:
          type: string
    Me:
      type: object
      required: [id, type, name, email, department_id, client_id, roles, permissions, scopes]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/UserType'
        name:
          type: string
        email:
          type: string
          format: email
        department_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        client_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        permissions:
          $ref: '#/components/schemas/PermissionMap'
        scopes:
          $ref: '#/components/schemas/ScopeMap'
    Device:
      type: object
      required: [id, platform, name, last_seen_at, last_sync_at, created_at, is_current]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        platform:
          type: string
          enum: [web, android, ios]
        name:
          type: [string, 'null']
        last_seen_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_sync_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        is_current:
          type: boolean
          description: True for the device that made this request.
    DeviceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Device'

    # ---- Users
    User:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - type: object
          required:
            - type
            - name
            - email
            - department_id
            - manager_id
            - client_id
            - contact_id
            - roles
            - is_active
            - must_change_password
            - password_changed_at
            - last_login_at
            - locked_until
          properties:
            type:
              $ref: '#/components/schemas/UserType'
            name:
              type: string
            email:
              type: string
              format: email
            department_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            manager_id:
              description: Direct manager (jefe directo).
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            client_id:
              description: Assigned client; required for external users, null for internal ones.
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            contact_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            roles:
              type: array
              items:
                $ref: '#/components/schemas/RoleRef'
            is_active:
              type: boolean
            must_change_password:
              type: boolean
            password_changed_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            last_login_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            locked_until:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
    UserPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/PageMeta'
    UserCreateBase:
      type: object
      required: [type, name, email, role_ids]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 190
        role_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        contact_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    InternalUserCreate:
      allOf:
        - $ref: '#/components/schemas/UserCreateBase'
        - type: object
          required: [department_id, initial_password]
          properties:
            type:
              type: string
              enum: [internal]
            department_id:
              $ref: '#/components/schemas/Uuid'
            manager_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            initial_password:
              type: string
              maxLength: 72
              writeOnly: true
              description: The user must change it at first login.
    ExternalUserCreate:
      allOf:
        - $ref: '#/components/schemas/UserCreateBase'
        - type: object
          required: [client_id]
          properties:
            type:
              type: string
              enum: [external]
            client_id:
              $ref: '#/components/schemas/Uuid'
    UserCreate:
      oneOf:
        - $ref: '#/components/schemas/InternalUserCreate'
        - $ref: '#/components/schemas/ExternalUserCreate'
      discriminator:
        propertyName: type
        mapping:
          internal: '#/components/schemas/InternalUserCreate'
          external: '#/components/schemas/ExternalUserCreate'
    UserUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 150
            email:
              type: string
              format: email
              maxLength: 190
            department_id:
              $ref: '#/components/schemas/Uuid'
            manager_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            contact_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            role_ids:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: '#/components/schemas/Uuid'

    # ---- Roles
    WidgetPlacement:
      type: object
      required: [code, position]
      properties:
        code:
          type: string
          maxLength: 50
          description: Widget code from the registry in `shared/`.
        position:
          type: integer
          minimum: 0
    Role:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - type: object
          required:
            [code, name, description, user_type, is_system, is_active, permissions, scopes, widgets]
          properties:
            code:
              type: [string, 'null']
              description: Only for system roles.
            name:
              type: string
            description:
              type: [string, 'null']
            user_type:
              $ref: '#/components/schemas/UserType'
            is_system:
              type: boolean
            is_active:
              type: boolean
            permissions:
              $ref: '#/components/schemas/PermissionMap'
            scopes:
              $ref: '#/components/schemas/ScopeMap'
            widgets:
              type: array
              items:
                $ref: '#/components/schemas/WidgetPlacement'
    RolePage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        meta:
          $ref: '#/components/schemas/PageMeta'
    RoleCreate:
      type: object
      required: [name, user_type, permissions, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 255
        user_type:
          $ref: '#/components/schemas/UserType'
        permissions:
          $ref: '#/components/schemas/PermissionMap'
        scopes:
          $ref: '#/components/schemas/ScopeMap'
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/WidgetPlacement'
    RoleUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
            description:
              type: [string, 'null']
              maxLength: 255
            permissions:
              $ref: '#/components/schemas/PermissionMap'
            scopes:
              $ref: '#/components/schemas/ScopeMap'
            widgets:
              type: array
              items:
                $ref: '#/components/schemas/WidgetPlacement'

    # ---- Departments
    Department:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - type: object
          required: [name, is_active]
          properties:
            name:
              type: string
            is_active:
              type: boolean
    DepartmentPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Department'
        meta:
          $ref: '#/components/schemas/PageMeta'
    DepartmentCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    DepartmentUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100

    # ---- Settings
    Company:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - type: object
          required:
            [legal_name, trade_name, tax_id, tax_regime_id, address, phone, email, logo_path]
          properties:
            legal_name:
              type: string
            trade_name:
              type: string
            tax_id:
              type: string
              description: NIT of the company.
            tax_regime_id:
              description: Tax regime (Hito 2 catalog); null until that catalog exists.
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            address:
              type: [string, 'null']
            phone:
              type: [string, 'null']
            email:
              type: [string, 'null']
              format: email
            logo_path:
              type: [string, 'null']
              readOnly: true
    CompanyUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          properties:
            legal_name:
              type: string
              minLength: 1
              maxLength: 190
            trade_name:
              type: string
              minLength: 1
              maxLength: 190
            tax_id:
              type: string
              minLength: 1
              maxLength: 30
            tax_regime_id:
              description: Accepted once the tax regime catalog exists (Hito 2).
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            address:
              type: [string, 'null']
              maxLength: 255
            phone:
              type: [string, 'null']
              maxLength: 40
            email:
              type: [string, 'null']
              format: email
              maxLength: 190
    FinancialSettingsFields:
      type: object
      properties:
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 code. GTQ by default.
        vat_rate:
          type: string
          pattern: '^0(\.\d{1,5})?$'
          description: >-
            Decimal string with up to 5 decimals, 0 ≤ rate < 1 (0.12000 = 12 %). Strings keep the exact
            decimal; money never travels as a float.
        income_tax_rate:
          type: string
          pattern: '^0(\.\d{1,5})?$'
          description: Same format as `vat_rate`.
        stale_cost_days:
          type: integer
          minimum: 1
          description: Days after which a product cost is flagged as stale.
        quote_validity_days:
          type: integer
          minimum: 1
    FinancialSettings:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - $ref: '#/components/schemas/FinancialSettingsFields'
        - type: object
          required: [currency_code, vat_rate, income_tax_rate, stale_cost_days, quote_validity_days]
    FinancialSettingsUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - $ref: '#/components/schemas/FinancialSettingsFields'
    SecuritySettingsFields:
      type: object
      properties:
        web_idle_minutes:
          type: integer
          minimum: 1
          description: Inactivity before the web session closes. Default 30.
        mobile_refresh_days:
          type: integer
          minimum: 1
          description: Lifetime of the mobile refresh token. Default 30.
        max_failed_attempts:
          type: integer
          minimum: 1
          description: Failed logins before the lockout. Default 3.
        lockout_minutes:
          type: integer
          minimum: 1
          description: Default 15.
        password_expiry_days:
          type: integer
          minimum: 1
          description: Default 90.
        password_min_length:
          type: integer
          minimum: 12
          maximum: 72
          description: Default 12; it can only be raised.
    SecuritySettings:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - $ref: '#/components/schemas/SecuritySettingsFields'
        - type: object
          required:
            - web_idle_minutes
            - mobile_refresh_days
            - max_failed_attempts
            - lockout_minutes
            - password_expiry_days
            - password_min_length
    SecuritySettingsUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - $ref: '#/components/schemas/SecuritySettingsFields'
    MailSettingsFields:
      type: object
      properties:
        from_name:
          type: string
          minLength: 1
          maxLength: 100
        from_address:
          type: string
          format: email
          maxLength: 190
        reply_to_address:
          type: [string, 'null']
          format: email
          maxLength: 190
    MailSettings:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - $ref: '#/components/schemas/MailSettingsFields'
        - type: object
          required: [from_name, from_address, reply_to_address]
    MailSettingsUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - $ref: '#/components/schemas/MailSettingsFields'

    # ---- Sequences
    Sequence:
      type: object
      required: [code, prefix, padding, include_year, year, next_value]
      properties:
        code:
          type: string
        prefix:
          type: string
          maxLength: 10
        padding:
          type: integer
          minimum: 0
          maximum: 12
          description: Zeros to the left.
        include_year:
          type: boolean
          description: When true the number carries the year and restarts every year.
        year:
          type: [integer, 'null']
          description: Year of the current counter.
        next_value:
          type: integer
          readOnly: true
    SequenceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Sequence'
    SequenceUpdate:
      type: object
      properties:
        prefix:
          type: string
          maxLength: 10
        padding:
          type: integer
          minimum: 0
          maximum: 12
        include_year:
          type: boolean

    # ---- Margin levels
    MarginLevel:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - type: object
          required: [name, rate, is_default, sort_order, is_active]
          properties:
            name:
              type: string
            rate:
              type: string
              pattern: '^0(\.\d{1,5})?$'
              description: Contribution margin on the sale price, 0 ≤ rate < 1 (0.33000 = 33 %), as an exact decimal string.
            is_default:
              type: boolean
              description: Exactly one active level is the default.
            sort_order:
              type: integer
              minimum: 0
            is_active:
              type: boolean
    MarginLevelPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MarginLevel'
        meta:
          $ref: '#/components/schemas/PageMeta'
    MarginLevelCreate:
      type: object
      required: [name, rate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        rate:
          type: string
          pattern: '^0(\.\d{1,5})?$'
        is_default:
          type: boolean
          default: false
        sort_order:
          type: integer
          minimum: 0
          default: 0
    MarginLevelUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 60
            rate:
              type: string
              pattern: '^0(\.\d{1,5})?$'
            is_default:
              type: boolean
              enum: [true]
              description: Only true is accepted; the default moves by choosing another level.
            sort_order:
              type: integer
              minimum: 0

    # ---- Audit
    AuditLog:
      type: object
      required:
        [
          id,
          occurred_at,
          user_id,
          device_id,
          action,
          entity_type,
          entity_id,
          before_data,
          after_data,
          ip_address,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        user_id:
          description: The actor; null when the system acted or a login failed.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        device_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        action:
          type: string
          description: For example `create`, `update`, `deactivate`, `login`.
        entity_type:
          type: string
          description: Table name.
        entity_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        before_data:
          type: [object, 'null']
          additionalProperties: true
          description: Only the fields that changed; never passwords or tokens.
        after_data:
          type: [object, 'null']
          additionalProperties: true
        ip_address:
          type: [string, 'null']
    AuditLogPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        meta:
          $ref: '#/components/schemas/PageMeta'

    # ---- Dashboard
    Dashboard:
      type: object
      required: [widgets]
      properties:
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/WidgetPlacement'
