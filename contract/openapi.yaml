openapi: 3.1.0
info:
  title: Soltec API
  version: 1.0.0
  description:
    'Contract of the Soltec CRM-ERP API. It is the single source of truth: the TypeScript types and the
    typed client are generated from it, and a test fails when a route is missing here or listed here without a route.
    Deployment endpoints (/system) are not part of the public contract.


    Conventions:

    - Every operation declares its access rule in `x-permission`: `public` (no session), `authenticated` (any user
    with a session) or `<resource>.<action>` (for example `users.view`). A route without it fails a test (ADR-0012).
    A session with a restricted token (password change pending) only reaches operations marked `x-allows-restricted-token`.
    An operation marked `x-planned: true` is specified but not implemented yet; the flag is removed in the pull
    request that adds its route.

    - Errors are `application/problem+json` with a stable English `code`; the web app maps it to Spanish.

    - Records that can be edited carry `version`. An update sends the version it read; a stale one answers 409 `conflict`.

    - Nothing is deleted: `deactivate` and `reactivate` change `is_active`. Lists hide inactive records unless `status`
    says otherwise.

    - Ids are UUID strings; timestamps are UTC ISO 8601 with milliseconds.

    - Scope: only the slices already being built. Each slice adds its own operations (see TODO.md).'
servers:
  - url: /api
    description: Same origin as the web app.
security:
  - bearerAuth: []
tags:
  - name: System
    description: Service status.
  - name: Auth
    description: Login, token refresh and password change.
  - name: Me
    description: The signed-in user and their own devices.
  - name: Users
    description: Internal user accounts.
  - name: Roles
    description: Roles (perfiles) with their permission matrix and data scopes.
  - name: Access catalogs
    description: Read-only lists used to build the permission matrix.
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Check that the API and its database answer.
      description: Public and free of internal detail. Used by the deployment smoke test and by monitoring.
      tags:
        - System
      x-permission: public
      security: []
      responses:
        '200':
          description: The API and its database answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The API answers but the database does not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password.
      description:
        'Returns a short-lived access token (about 15 minutes) and the user with their effective permissions.
        On the web the refresh token travels in an httpOnly cookie scoped to /api/v1/auth; on mobile it is returned
        in the body (`refresh_token`) for secure storage. Wrong email, wrong password and a locked account all answer
        the same 401 `invalid_credentials`. If the password expired or must be changed, the call succeeds with `password_change_required:
        true` and a restricted token that only works on POST /v1/auth/password/change. Answers 503 `auth_not_configured`
        when the server has no JWT secret.'
      tags:
        - Auth
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: Refresh token cookie (web only). httpOnly, Secure, SameSite=Strict, Path=/api/v1/auth.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate the refresh token and get a new access token.
      description:
        The refresh token comes from the cookie (web) or from the body (mobile). Each refresh issues
        a new refresh token and revokes the previous one. Presenting a token that was already revoked revokes every
        token of that device (suspected theft), apart from a short grace window that covers two tabs refreshing
        at once. Answers 401 `token_invalid` or `token_expired`.
      tags:
        - Auth
      x-permission: public
      security: []
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          description: Refresh token (web).
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens.
          headers:
            Set-Cookie:
              description: Rotated refresh token cookie (web only).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out of the current device.
      description:
        Revokes the current device and all its refresh tokens, and clears the cookie. Works with a restricted
        token, so a user who must change the password can still leave.
      tags:
        - Auth
      x-permission: authenticated
      x-allows-restricted-token: true
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/password/change:
    post:
      operationId: changePassword
      summary: Change the password of the signed-in user.
      description:
        Requires the current password. Works with a restricted token, which is how an initial password
        gets replaced. The new password must follow the policy (at least 12 characters, at most 72 bytes, different
        from the email) and different from the current one. A wrong current password answers 422 with the field error
        `current_password_incorrect`. Every other device of the user is signed out.
      tags:
        - Auth
      x-permission: authenticated
      x-allows-restricted-token: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/me:
    get:
      operationId: getMe
      summary: Get the signed-in user with roles, effective permissions and scopes.
      description:
        Permissions are the union of all the user's roles, read from the database on every request, so
        a role change applies at the next call. With several roles the widest scope wins (all, then team, then own).
        The web app uses it to hide menus; the server is the real control. With a restricted token it answers 403
        `password_change_required`.
      tags:
        - Me
      x-permission: authenticated
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/users:
    get:
      operationId: listUsers
      summary: List users.
      description: Inactive users are hidden unless status says otherwise.
      tags:
        - Users
      x-permission: users.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/StatusFilter'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserType'
        - name: role_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
    post:
      operationId: createUser
      summary: Create a user.
      description:
        Creates an internal user with a temporary `initial_password`; the account starts with `must_change_password`
        true. Email must be unique among active users. Only an administrator can give the `admin` role. Role ids
        are checked against existing internal roles. External users arrive with the client portal.
      tags:
        - Users
      x-permission: users.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUser
      summary: Get a user by id.
      description: Returns the user, active or not.
      tags:
        - Users
      x-permission: users.view
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      operationId: updateUser
      summary: Update a user.
      description:
        Changes only the fields sent. Only an administrator can give or take the `admin` role or edit
        another administrator. Only an administrator can change their own roles, and only when another active
        administrator remains; the only active administrator cannot (409 `last_admin`). A stale version answers
        409 `conflict`.
      tags:
        - Users
      x-permission: users.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/users/{userId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: deactivateUser
      summary: Deactivate a user.
      description:
        Logical deactivation; revokes every session of the user. Nobody can deactivate themselves (403
        `forbidden`). The last active administrator cannot be deactivated (409 `last_admin`). Idempotent.
      tags:
        - Users
      x-permission: users.deactivate
      responses:
        '200':
          description: The deactivated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/users/{userId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: reactivateUser
      summary: Reactivate a user.
      description:
        Fails with 422 `validation_failed` if the email is now used by an active user. The user must
        sign in again. Idempotent.
      tags:
        - Users
      x-permission: users.deactivate
      responses:
        '200':
          description: The reactivated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/roles:
    get:
      operationId: listRoles
      summary: List roles.
      description: Returns a page of roles with their permission matrix and data scopes.
      tags:
        - Roles
      x-permission: roles.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/StatusFilter'
        - name: user_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserType'
      responses:
        '200':
          description: A page of roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
    post:
      operationId: createRole
      summary: Create a role.
      description:
        'Business roles (P5) are created here by an administrator; only `admin` is seeded in this slice.
        The matrix is checked: permission and resource codes must exist. In this slice only internal roles can be
        created and only the `own` and `all` scopes are accepted (`team` arrives with departments, `client` with the
        client portal). Granting permissions on `users` and `roles` is close to making someone an administrator.'
      tags:
        - Roles
      x-permission: roles.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    get:
      operationId: getRole
      summary: Get a role with its matrix.
      description: Returns the role with its full matrix, active or not.
      tags:
        - Roles
      x-permission: roles.view
      responses:
        '200':
          description: The role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      operationId: updateRole
      summary: Update a role.
      description:
        '`permissions` and `scopes`, when sent, replace the whole set. `user_type` cannot change. System
        roles (`is_system`) cannot be edited: 409 `system_role_immutable`. A change applies to every holder of the
        role at their next request. A stale version answers 409 `conflict`.'
      tags:
        - Roles
      x-permission: roles.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: The updated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/roles/{roleId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    post:
      operationId: deactivateRole
      summary: Deactivate a role.
      description:
        System roles cannot be deactivated (409 `system_role_immutable`). A role still assigned to active
        users answers 409 `conflict`. Idempotent.
      tags:
        - Roles
      x-permission: roles.deactivate
      responses:
        '200':
          description: The deactivated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/roles/{roleId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    post:
      operationId: reactivateRole
      summary: Reactivate a role.
      description: Fails with 422 `validation_failed` if the name is now used by an active role. Idempotent.
      tags:
        - Roles
      x-permission: roles.deactivate
      responses:
        '200':
          description: The reactivated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/resources:
    get:
      operationId: listResources
      summary: List the protected resources (one per module).
      description: System table seeded by migrations; read-only.
      tags:
        - Access catalogs
      x-permission: roles.view
      responses:
        '200':
          description: The resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/permissions:
    get:
      operationId: listPermissions
      summary: List the permission verbs (view, create, edit, deactivate, approve…).
      description: System table seeded by migrations; read-only.
      tags:
        - Access catalogs
      x-permission: roles.view
      responses:
        '200':
          description: The permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description:
        Access token (about 15 minutes). Carries only the user id and the device id; permissions are
        read from the database.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: q
      in: query
      required: false
      description: Free text matched against the name (and the email for users).
      schema:
        type: string
        maxLength: 100
    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - active
          - inactive
          - all
        default: active
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  responses:
    Unauthorized:
      description: No valid session (`token_invalid`, `token_expired`) or wrong credentials (`invalid_credentials`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description:
        The user lacks the permission (`forbidden`), or the session is restricted until the password
        is changed (`password_change_required`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such record, or it is outside the caller's data scope (never revealed which).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description:
        A stale version (`conflict`) or a rule that blocks the change (`last_admin`, `system_role_immutable`,
        `default_margin_level`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Invalid input. `errors` lists each field with a stable code.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    ServiceUnavailable:
      description: The service is not configured (`auth_not_configured`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unexpected:
      description: Unexpected error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    RecordMeta:
      type: object
      required:
        - id
        - created_at
        - updated_at
        - version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          minimum: 1
          description: Incremented on every change. Send it back when updating.
    PageMeta:
      type: object
      required:
        - page
        - per_page
        - total
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    Version:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
          description: The version that was read.
    UserType:
      type: string
      enum:
        - internal
        - external
    DataScope:
      type: string
      description:
        Which rows of a resource the user reaches. `client` is only for external roles, and the only
        scope they can have.
      enum:
        - own
        - team
        - all
        - client
    PermissionMap:
      type: object
      description: Permission codes (view, create, edit, deactivate, approve…) by resource code.
      additionalProperties:
        type: array
        uniqueItems: true
        items:
          type: string
          maxLength: 50
    ScopeMap:
      type: object
      description: Data scope by resource code. A resource without an entry is `own`.
      additionalProperties:
        $ref: '#/components/schemas/DataScope'
    CatalogItem:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
    CatalogItemList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
    Health:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        checks:
          type: object
          required:
            - database
          properties:
            database:
              type: string
              enum:
                - ok
                - error
    ErrorCode:
      type: string
      description: Stable identifier; the web app maps each one to Spanish text.
      enum:
        - invalid_credentials
        - password_change_required
        - token_expired
        - token_invalid
        - forbidden
        - not_found
        - validation_failed
        - conflict
        - last_admin
        - system_role_immutable
        - auth_not_configured
    Problem:
      type: object
      description:
        RFC 9457 problem details. "code" is a stable identifier in English; the web app maps it to Spanish
        text.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
    FieldError:
      type: object
      required:
        - field
        - code
      properties:
        field:
          type: string
          description: JSON path of the field, for example `role_ids` or `rate`.
        code:
          type: string
          description:
            Stable code such as `required`, `invalid`, `too_short`, `too_long`, `taken`, `not_found`,
            `out_of_range`, `current_password_incorrect`.
        message:
          type: string
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - errors
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
    DeviceInfo:
      type: object
      required:
        - platform
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Id returned by an earlier login on this device; omit on the first login.
        platform:
          type: string
          enum:
            - web
            - android
            - ios
        name:
          type: string
          maxLength: 100
          description: Text that helps the user recognize the device.
    LoginRequest:
      type: object
      required:
        - email
        - password
        - device
      properties:
        email:
          type: string
          format: email
          maxLength: 190
        password:
          type: string
          maxLength: 72
          writeOnly: true
        device:
          $ref: '#/components/schemas/DeviceInfo'
    RefreshRequest:
      type: object
      description: Mobile only. On the web the refresh token comes from the cookie and the body is empty.
      properties:
        refresh_token:
          type: string
          writeOnly: true
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - password_change_required
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          description: Seconds until the access token expires.
        password_change_required:
          type: boolean
          description: True when the token is restricted to POST /v1/auth/password/change.
        refresh_token:
          type: string
          description: Present only when the client is not a web browser (mobile); the web gets a cookie.
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/TokenResponse'
        - type: object
          required:
            - device_id
            - user
          properties:
            device_id:
              $ref: '#/components/schemas/Uuid'
            user:
              $ref: '#/components/schemas/Me'
    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          maxLength: 72
          writeOnly: true
        new_password:
          type: string
          maxLength: 72
          writeOnly: true
    RoleRef:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          type:
            - string
            - 'null'
          description: Only for system roles (`admin`, `external_client`).
        name:
          type: string
    Me:
      type: object
      required:
        - id
        - type
        - name
        - email
        - roles
        - permissions
        - scopes
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/UserType'
        name:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        permissions:
          $ref: '#/components/schemas/PermissionMap'
        scopes:
          $ref: '#/components/schemas/ScopeMap'
    User:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - type: object
          required:
            - type
            - name
            - email
            - roles
            - is_active
            - must_change_password
            - password_changed_at
            - last_login_at
            - locked_until
          properties:
            type:
              $ref: '#/components/schemas/UserType'
            name:
              type: string
            email:
              type: string
              format: email
            roles:
              type: array
              items:
                $ref: '#/components/schemas/RoleRef'
            is_active:
              type: boolean
            must_change_password:
              type: boolean
            password_changed_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            last_login_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            locked_until:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
    UserPage:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/PageMeta'
    UserCreate:
      type: object
      required:
        - name
        - email
        - role_ids
        - initial_password
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 190
        role_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        initial_password:
          type: string
          maxLength: 72
          writeOnly: true
          description: Temporary password; the user must change it at first login.
    UserUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 150
            email:
              type: string
              format: email
              maxLength: 190
            role_ids:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: '#/components/schemas/Uuid'
    Role:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - type: object
          required:
            - code
            - name
            - description
            - user_type
            - is_system
            - is_active
            - permissions
            - scopes
          properties:
            code:
              type:
                - string
                - 'null'
              description: Only for system roles.
            name:
              type: string
            description:
              type:
                - string
                - 'null'
            user_type:
              $ref: '#/components/schemas/UserType'
            is_system:
              type: boolean
            is_active:
              type: boolean
            permissions:
              $ref: '#/components/schemas/PermissionMap'
            scopes:
              $ref: '#/components/schemas/ScopeMap'
    RolePage:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        meta:
          $ref: '#/components/schemas/PageMeta'
    RoleCreate:
      type: object
      required:
        - name
        - user_type
        - permissions
        - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type:
            - string
            - 'null'
          maxLength: 255
        user_type:
          $ref: '#/components/schemas/UserType'
        permissions:
          $ref: '#/components/schemas/PermissionMap'
        scopes:
          $ref: '#/components/schemas/ScopeMap'
    RoleUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
            description:
              type:
                - string
                - 'null'
              maxLength: 255
            permissions:
              $ref: '#/components/schemas/PermissionMap'
            scopes:
              $ref: '#/components/schemas/ScopeMap'
