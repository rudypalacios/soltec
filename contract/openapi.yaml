openapi: 3.1.0
info:
  title: Soltec API
  version: 1.0.0
  description:
    'Contract of the Soltec CRM-ERP API. It is the single source of truth: the TypeScript types and the
    typed client are generated from it, and a test fails when a route is missing here or listed here without a route.
    Deployment endpoints (/system) are not part of the public contract.


    Conventions:

    - Every operation declares its access rule in `x-permission`: `public` (no session), `authenticated` (any user
    with a session) or `<resource>.<action>` (for example `users.view`). A route without it fails a test (ADR-0012).
    A session with a restricted token (password change pending) only reaches operations marked `x-allows-restricted-token`.
    An operation marked `x-planned: true` is specified but not implemented yet; the flag is removed in the pull
    request that adds its route.

    - Errors are `application/problem+json` with a stable English `code`; the web app maps it to Spanish.

    - Records that can be edited carry `version`. An update sends the version it read; a stale one answers 409 `conflict`.

    - Nothing is deleted: `deactivate` and `reactivate` change `is_active`. Lists hide inactive records unless `status`
    says otherwise.

    - Ids are UUID strings; timestamps are UTC ISO 8601 with milliseconds.

    - Scope: only the slices already being built. Each slice adds its own operations (see TODO.md).'
servers:
  - url: /api
    description: Same origin as the web app.
security:
  - bearerAuth: []
tags:
  - name: System
    description: Service status.
  - name: Auth
    description: Login, token refresh, password change, invitations and password recovery.
  - name: Me
    description: The signed-in user and their own devices.
  - name: Users
    description: Internal user accounts.
  - name: Roles
    description: Roles (perfiles) with their permission matrix and data scopes.
  - name: Departments
    description: Departments of the organization. The direct manager of each user lives in the user.
  - name: Settings
    description: Company data and logo, tax rates, and the numbering of documents.
  - name: Access catalogs
    description: Read-only lists used to build the permission matrix.
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Check that the API and its database answer.
      description: Public and free of internal detail. Used by the deployment smoke test and by monitoring.
      tags:
        - System
      x-permission: public
      security: []
      responses:
        '200':
          description: The API and its database answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The API answers but the database does not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password.
      description:
        'Returns a short-lived access token (about 15 minutes) and the user with their effective permissions.
        On the web the refresh token travels in an httpOnly cookie scoped to /api/v1/auth; on mobile it is returned
        in the body (`refresh_token`) for secure storage. Wrong email, wrong password and a locked account all answer
        the same 401 `invalid_credentials`. If the password expired or must be changed, the call succeeds with `password_change_required:
        true` and a restricted token that only works on POST /v1/auth/password/change. Answers 503 `auth_not_configured`
        when the server has no JWT secret.'
      tags:
        - Auth
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: Refresh token cookie (web only). httpOnly, Secure, SameSite=Strict, Path=/api/v1/auth.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate the refresh token and get a new access token.
      description:
        The refresh token comes from the cookie (web) or from the body (mobile). Each refresh issues
        a new refresh token and revokes the previous one. Presenting a token that was already revoked revokes every
        token of that device (suspected theft), apart from a short grace window that covers two tabs refreshing
        at once. Answers 401 `token_invalid` or `token_expired`.
      tags:
        - Auth
      x-permission: public
      security: []
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          description: Refresh token (web).
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens.
          headers:
            Set-Cookie:
              description: Rotated refresh token cookie (web only).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out of the current device.
      description:
        Revokes the current device and all its refresh tokens, and clears the cookie. Works with a restricted
        token, so a user who must change the password can still leave.
      tags:
        - Auth
      x-permission: authenticated
      x-allows-restricted-token: true
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/password/change:
    post:
      operationId: changePassword
      summary: Change the password of the signed-in user.
      description:
        Requires the current password. Works with a restricted token, which is how an initial password
        gets replaced. The new password must follow the policy (at least 12 characters, at most 72 bytes, different
        from the email) and different from the current one. A wrong current password answers 422 with the field error
        `current_password_incorrect`. Every other device of the user is signed out.
      tags:
        - Auth
      x-permission: authenticated
      x-allows-restricted-token: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Choose a password with the link of an invitation.
      description:
        The token comes from the email sent when the account was created. It works once and for 72 hours;
        a weak password is rejected without spending it. 400 `link_invalid` (unknown, used, replaced by a newer
        link, or the account is no longer waiting for an invitation) or `link_expired`. Does not sign the user in.
      tags:
        - Auth
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkPasswordRequest'
      responses:
        '204':
          description: Password set; the user can sign in.
        '400':
          $ref: '#/components/responses/LinkRejected'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Ask for a password recovery email.
      description:
        Always answers 204, whether the account exists or not, and the work happens after the response, so
        neither the body nor the timing reveals it. Only an active account that already accepted its invitation
        gets an email, at most one per minute; its link works once and for one hour, and a new link invalidates
        the previous ones.
      tags:
        - Auth
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Request accepted.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/auth/password/reset:
    post:
      operationId: resetPassword
      summary: Choose a new password with the link of a recovery email.
      description:
        The account state is checked again when the link is used, so it must be active and have accepted its
        invitation. Success removes the lock and signs the user out of every device. 400 `link_invalid` or
        `link_expired`; a weak password is rejected without spending the link.
      tags:
        - Auth
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkPasswordRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/LinkRejected'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/me:
    get:
      operationId: getMe
      summary: Get the signed-in user with roles, effective permissions and scopes.
      description:
        Permissions are the union of all the user's roles, read from the database on every request, so
        a role change applies at the next call. With several roles the widest scope wins (all, then team, then own).
        The web app uses it to hide menus; the server is the real control. With a restricted token it answers 403
        `password_change_required`.
      tags:
        - Me
      x-permission: authenticated
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/users:
    get:
      operationId: listUsers
      summary: List users.
      description: Inactive users are hidden unless status says otherwise.
      tags:
        - Users
      x-permission: users.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/StatusFilter'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserType'
        - name: role_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: department_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: eligible_manager_for
          in: query
          required: false
          description:
            Leaves out this user and everybody under them, directly or not; none of them can be their manager. For
            a manager picker.
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
    post:
      operationId: createUser
      summary: Create a user.
      description:
        Creates an internal user without a password and emails them a single-use invitation link (valid 72 hours)
        to choose one; the administrator never sees a password or a link. Until the invitation is accepted the account
        has `invitation_pending` true and cannot sign in. The user is created even when the email could not be sent
        (`invitation_sent` false), so resend it with POST /v1/users/{userId}/invite. Email must be unique among active
        users. Only an administrator can give the `admin` role. Role ids are checked against existing internal
        roles. `department_id` must be an active department and `manager_id` an active internal user (422
        `not_found`); both are optional in the API (the first administrator has neither) and the web form asks for the
        department. A caller whose `users` scope is not `all` must keep the new user in reach. With `team`, in their
        department or under them (422 `out_of_scope` on `department_id` and `manager_id`); with `own`, nobody can be
        created (403 `forbidden`). External users arrive with the client portal.
      tags:
        - Users
      x-permission: users.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUser
      summary: Get a user by id.
      description: Returns the user, active or not.
      tags:
        - Users
      x-permission: users.view
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      operationId: updateUser
      summary: Update a user.
      description:
        Changes only the fields sent. Only an administrator can give or take the `admin` role or edit
        another administrator. Only an administrator can change their own roles, and only when another active
        administrator remains; the only active administrator cannot (409 `last_admin`). `department_id` and
        `manager_id` sent as null clear them. The manager must be another active internal user (422 `invalid` for the
        user themselves, `not_found` otherwise) who does not report to this user, directly or not (422 `cycle`).
        Only internal users have a department or a manager (422 `invalid` for an external one). A caller with the
        `team` scope cannot move someone out of their team (422 `out_of_scope`). On their own account, anyone but an
        administrator changes only the name (403 `forbidden` for email, roles, department or manager). A stale
        version, or two changes of manager that cross, answer 409 `conflict`.
      tags:
        - Users
      x-permission: users.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/users/{userId}/invite:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: inviteUser
      summary: Send the invitation email again.
      description:
        Issues a new single-use link (72 hours) and invalidates the previous ones. Only for a user with
        `invitation_pending`; any other state answers 409 `invitation_not_pending`. Only an administrator can
        resend to another administrator. 502 `mail_send_failed` when the mail server refuses the message; 503
        `mail_not_configured` when the server has no mail settings.
      tags:
        - Users
      x-permission: users.edit
      responses:
        '204':
          description: Email sent.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/MailFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/users/{userId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: deactivateUser
      summary: Deactivate a user.
      description:
        Logical deactivation; revokes every session of the user. Nobody can deactivate themselves (403
        `forbidden`). The last active administrator cannot be deactivated (409 `last_admin`). Idempotent.
      tags:
        - Users
      x-permission: users.deactivate
      responses:
        '200':
          description: The deactivated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/users/{userId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: reactivateUser
      summary: Reactivate a user.
      description:
        Fails with 422 `validation_failed` if the email is now used by an active user. The user must
        sign in again. Idempotent.
      tags:
        - Users
      x-permission: users.deactivate
      responses:
        '200':
          description: The reactivated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/roles:
    get:
      operationId: listRoles
      summary: List roles.
      description: Returns a page of roles with their permission matrix and data scopes.
      tags:
        - Roles
      x-permission: roles.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/StatusFilter'
        - name: user_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserType'
      responses:
        '200':
          description: A page of roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
    post:
      operationId: createRole
      summary: Create a role.
      description:
        'Business roles (P5) are created here by an administrator; only `admin` is seeded in this slice.
        The matrix is checked: permission and resource codes must exist. In this slice only internal roles can be
        created, with the `own`, `team` and `all` scopes (`client` arrives with the client portal). Granting
        permissions on `users` and `roles` is close to making someone an administrator.'
      tags:
        - Roles
      x-permission: roles.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    get:
      operationId: getRole
      summary: Get a role with its matrix.
      description: Returns the role with its full matrix, active or not.
      tags:
        - Roles
      x-permission: roles.view
      responses:
        '200':
          description: The role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      operationId: updateRole
      summary: Update a role.
      description:
        '`permissions` and `scopes`, when sent, replace the whole set. `user_type` cannot change. System
        roles (`is_system`) cannot be edited: 409 `system_role_immutable`. A change applies to every holder of the
        role at their next request. A stale version answers 409 `conflict`.'
      tags:
        - Roles
      x-permission: roles.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: The updated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/roles/{roleId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    post:
      operationId: deactivateRole
      summary: Deactivate a role.
      description:
        System roles cannot be deactivated (409 `system_role_immutable`). A role still assigned to active
        users answers 409 `conflict`. Idempotent.
      tags:
        - Roles
      x-permission: roles.deactivate
      responses:
        '200':
          description: The deactivated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/roles/{roleId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    post:
      operationId: reactivateRole
      summary: Reactivate a role.
      description: Fails with 422 `validation_failed` if the name is now used by an active role. Idempotent.
      tags:
        - Roles
      x-permission: roles.deactivate
      responses:
        '200':
          description: The reactivated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/departments:
    get:
      operationId: listDepartments
      summary: List departments.
      description:
        Inactive departments are hidden unless status says otherwise. Departments have no data scope of their own;
        whoever may view them sees all of them.
      tags:
        - Departments
      x-permission: departments.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: A page of departments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
    post:
      operationId: createDepartment
      summary: Create a department.
      description: The name must be unique among active departments (422 `taken`).
      tags:
        - Departments
      x-permission: departments.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/departments/{departmentId}:
    parameters:
      - $ref: '#/components/parameters/DepartmentId'
    get:
      operationId: getDepartment
      summary: Get a department by id.
      description: Returns the department, active or not.
      tags:
        - Departments
      x-permission: departments.view
      responses:
        '200':
          description: The department.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      operationId: updateDepartment
      summary: Rename a department.
      description: A stale version answers 409 `conflict`; a name used by another active department, 422 `taken`.
      tags:
        - Departments
      x-permission: departments.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
      responses:
        '200':
          description: The updated department.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/departments/{departmentId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/DepartmentId'
    post:
      operationId: deactivateDepartment
      summary: Deactivate a department.
      description:
        Logical deactivation. Refused while the department has active users (409 `department_in_use`, with
        `active_user_count`); move them to another department first. Inactive users may keep it. Idempotent.
      tags:
        - Departments
      x-permission: departments.deactivate
      responses:
        '200':
          description: The deactivated department.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/departments/{departmentId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/DepartmentId'
    post:
      operationId: reactivateDepartment
      summary: Reactivate a department.
      description: Fails with 422 `validation_failed` if the name is now used by an active department. Idempotent.
      tags:
        - Departments
      x-permission: departments.deactivate
      responses:
        '200':
          description: The reactivated department.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/resources:
    get:
      operationId: listResources
      summary: List the protected resources (one per module).
      description: System table seeded by migrations; read-only.
      tags:
        - Access catalogs
      x-permission: roles.view
      responses:
        '200':
          description: The resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/permissions:
    get:
      operationId: listPermissions
      summary: List the permission verbs (view, create, edit, deactivate, approve…).
      description: System table seeded by migrations; read-only.
      tags:
        - Access catalogs
      x-permission: roles.view
      responses:
        '200':
          description: The permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/branding:
    get:
      operationId: getBranding
      summary: The company's name and logo version.
      description:
        Public, because the sign-in screen shows the company before anyone has a session. Exposes nothing else of
        the company. With no name configured yet, `trade_name` is empty and the web app shows the product's own mark.
      tags:
        - Settings
      x-permission: public
      security: []
      responses:
        '200':
          description: The branding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branding'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/branding/logo:
    get:
      operationId: getBrandingLogo
      summary: The company's logo.
      description:
        A WebP image of at most 512 px on its longer side. Public like `/v1/branding`. The response carries an `ETag`
        (the logo version); a client that sends it back in `If-None-Match` gets 304 instead of the image.
      tags:
        - Settings
      x-permission: public
      security: []
      responses:
        '200':
          description: The logo.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '304':
          description: The client's copy is current.
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/settings/company:
    get:
      operationId: getCompany
      summary: The company's data.
      description: The only company of the instance (one instance per company).
      tags:
        - Settings
      x-permission: company.view
      responses:
        '200':
          description: The company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      operationId: updateCompany
      summary: Update the company's data.
      description:
        All fields are sent every time (the form is the unit of change). A stale version answers 409 `conflict`.
        The logo has its own operations.
      tags:
        - Settings
      x-permission: company.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdate'
      responses:
        '200':
          description: The updated company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/settings/company/logo:
    put:
      operationId: setCompanyLogo
      summary: Upload the company's logo.
      description:
        The request body is the image itself (PNG, JPEG or WebP, at most 1 MB and 8 megapixels), not a form. The
        type is read from the content, whatever `Content-Type` says. SVG is refused. The image is decoded and
        saved again as WebP of at most 512 px, which drops any metadata. Errors on field `logo` are `required`,
        `too_large`, `unsupported_type` and `invalid`.
      tags:
        - Settings
      x-permission: company.edit
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The company with its new logo version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
    delete:
      operationId: deleteCompanyLogo
      summary: Remove the company's logo.
      description: Idempotent. The web app goes back to the product's own mark.
      tags:
        - Settings
      x-permission: company.edit
      responses:
        '200':
          description: The company without a logo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/settings/financial:
    get:
      operationId: getFinancialSettings
      summary: Tax rates and business-rule periods.
      tags:
        - Settings
      x-permission: financial_settings.view
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      operationId: updateFinancialSettings
      summary: Update tax rates and business-rule periods.
      description:
        Documents already issued keep the values they were issued with. The currency is not editable (P1). A stale
        version answers 409 `conflict`.
      tags:
        - Settings
      x-permission: financial_settings.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialSettingsUpdate'
      responses:
        '200':
          description: The updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/sequences:
    get:
      operationId: listSequences
      summary: The numbering rules of the documents.
      description:
        One per kind of document (quotes, projects...). They are created by the migration of the module that issues
        the documents, so there is no create or delete.
      tags:
        - Settings
      x-permission: sequences.view
      responses:
        '200':
          description: The sequences, by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SequenceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/sequences/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z_]+$'
    patch:
      operationId: updateSequence
      summary: Change a numbering rule.
      description:
        Prefix, padding and period apply to the numbers issued from now on; existing numbers never change. To keep
        numbers unique the period cannot change once a number was issued (422 `period` `locked`) and the counter can
        only go up (422 `next_value` `too_low`). A stale version answers 409 `conflict`.
      tags:
        - Settings
      x-permission: sequences.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SequenceUpdate'
      responses:
        '200':
          description: The updated sequence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sequence'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description:
        Access token (about 15 minutes). Carries only the user id and the device id; permissions are
        read from the database.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: q
      in: query
      required: false
      description: Free text matched against the name (and the email for users).
      schema:
        type: string
        maxLength: 100
    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - active
          - inactive
          - all
        default: active
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  responses:
    Unauthorized:
      description: No valid session (`token_invalid`, `token_expired`) or wrong credentials (`invalid_credentials`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description:
        The user lacks the permission (`forbidden`), or the session is restricted until the password
        is changed (`password_change_required`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such record, or it is outside the caller's data scope (never revealed which).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description:
        A stale version (`conflict`) or a rule that blocks the change (`last_admin`, `invitation_not_pending`, `system_role_immutable`,
        `department_in_use`, `default_margin_level`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Invalid input. `errors` lists each field with a stable code.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    LinkRejected:
      description: The email link cannot be used (`link_invalid`, `link_expired`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MailFailed:
      description: The mail server refused the message (`mail_send_failed`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: The service is not configured (`auth_not_configured`, `mail_not_configured`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unexpected:
      description: Unexpected error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    RecordMeta:
      type: object
      required:
        - id
        - created_at
        - updated_at
        - version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          minimum: 1
          description: Incremented on every change. Send it back when updating.
    PageMeta:
      type: object
      required:
        - page
        - per_page
        - total
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    Version:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
          description: The version that was read.
    UserType:
      type: string
      enum:
        - internal
        - external
    DataScope:
      type: string
      description:
        Which rows of a resource the user reaches. `team` covers the user, everybody under them through the direct
        manager (directly or not) and the members of their department. `client` is only for external roles, and the
        only scope they can have.
      enum:
        - own
        - team
        - all
        - client
    PermissionMap:
      type: object
      description: Permission codes (view, create, edit, deactivate, approve…) by resource code.
      additionalProperties:
        type: array
        uniqueItems: true
        items:
          type: string
          maxLength: 50
    ScopeMap:
      type: object
      description: Data scope by resource code. A resource without an entry is `own`.
      additionalProperties:
        $ref: '#/components/schemas/DataScope'
    CatalogItem:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
    CatalogItemList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
    Health:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        checks:
          type: object
          required:
            - database
          properties:
            database:
              type: string
              enum:
                - ok
                - error
    ErrorCode:
      type: string
      description: Stable identifier; the web app maps each one to Spanish text.
      enum:
        - invalid_credentials
        - password_change_required
        - token_expired
        - token_invalid
        - forbidden
        - not_found
        - validation_failed
        - conflict
        - last_admin
        - system_role_immutable
        - department_in_use
        - auth_not_configured
    Problem:
      type: object
      description:
        RFC 9457 problem details. "code" is a stable identifier in English; the web app maps it to Spanish
        text.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
        active_user_count:
          type: integer
          description: With `department_in_use`, how many active users the department still has.
    FieldError:
      type: object
      required:
        - field
        - code
      properties:
        field:
          type: string
          description: JSON path of the field, for example `role_ids` or `rate`.
        code:
          type: string
          description:
            Stable code such as `required`, `invalid`, `too_short`, `too_long`, `taken`, `not_found`,
            `out_of_range`, `too_large` and `unsupported_type` (an uploaded image), `locked` (a period that can no longer change), `too_low` (a counter that would go down), `current_password_incorrect`, `cycle` (a manager who reports to the user), `out_of_scope` (the
            user would end up outside the caller's data scope).
        message:
          type: string
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - errors
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
    DeviceInfo:
      type: object
      required:
        - platform
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Id returned by an earlier login on this device; omit on the first login.
        platform:
          type: string
          enum:
            - web
            - android
            - ios
        name:
          type: string
          maxLength: 100
          description: Text that helps the user recognize the device.
    LoginRequest:
      type: object
      required:
        - email
        - password
        - device
      properties:
        email:
          type: string
          format: email
          maxLength: 190
        password:
          type: string
          maxLength: 72
          writeOnly: true
        device:
          $ref: '#/components/schemas/DeviceInfo'
    RefreshRequest:
      type: object
      description: Mobile only. On the web the refresh token comes from the cookie and the body is empty.
      properties:
        refresh_token:
          type: string
          writeOnly: true
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - password_change_required
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          description: Seconds until the access token expires.
        password_change_required:
          type: boolean
          description: True when the token is restricted to POST /v1/auth/password/change.
        refresh_token:
          type: string
          description: Present only when the client is not a web browser (mobile); the web gets a cookie.
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/TokenResponse'
        - type: object
          required:
            - device_id
            - user
          properties:
            device_id:
              $ref: '#/components/schemas/Uuid'
            user:
              $ref: '#/components/schemas/Me'
    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          maxLength: 72
          writeOnly: true
        new_password:
          type: string
          maxLength: 72
          writeOnly: true
    RoleRef:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          type:
            - string
            - 'null'
          description: Only for system roles (`admin`, `external_client`).
        name:
          type: string
    NamedRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
    Me:
      type: object
      required:
        - id
        - type
        - name
        - email
        - roles
        - permissions
        - scopes
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/UserType'
        name:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        permissions:
          $ref: '#/components/schemas/PermissionMap'
        scopes:
          $ref: '#/components/schemas/ScopeMap'
    User:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - type: object
          required:
            - type
            - name
            - email
            - roles
            - department
            - manager
            - is_active
            - must_change_password
            - invitation_pending
            - password_changed_at
            - last_login_at
            - locked_until
          properties:
            type:
              $ref: '#/components/schemas/UserType'
            name:
              type: string
            email:
              type: string
              format: email
            roles:
              type: array
              items:
                $ref: '#/components/schemas/RoleRef'
            department:
              oneOf:
                - $ref: '#/components/schemas/NamedRef'
                - type: 'null'
            manager:
              description: The direct manager (jefe directo).
              oneOf:
                - $ref: '#/components/schemas/NamedRef'
                - type: 'null'
            is_active:
              type: boolean
            must_change_password:
              type: boolean
            invitation_pending:
              type: boolean
              description: Created by an administrator and not yet accepted; there is no password yet.
            password_changed_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            last_login_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            locked_until:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
    UserPage:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/PageMeta'
    UserCreate:
      type: object
      required:
        - name
        - email
        - role_ids
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 190
        role_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        department_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        manager_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    UserCreated:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required:
            - invitation_sent
          properties:
            invitation_sent:
              type: boolean
              description: Whether the invitation email was handed to the mail server.
    LinkPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The token in the link of the email (after `#token=`).
        password:
          type: string
          maxLength: 72
          writeOnly: true
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 190
    UserUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 150
            email:
              type: string
              format: email
              maxLength: 190
            role_ids:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: '#/components/schemas/Uuid'
            department_id:
              description: Null clears it.
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            manager_id:
              description: Null clears it.
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
    Role:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - type: object
          required:
            - code
            - name
            - description
            - user_type
            - is_system
            - is_active
            - permissions
            - scopes
          properties:
            code:
              type:
                - string
                - 'null'
              description: Only for system roles.
            name:
              type: string
            description:
              type:
                - string
                - 'null'
            user_type:
              $ref: '#/components/schemas/UserType'
            is_system:
              type: boolean
            is_active:
              type: boolean
            permissions:
              $ref: '#/components/schemas/PermissionMap'
            scopes:
              $ref: '#/components/schemas/ScopeMap'
    RolePage:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        meta:
          $ref: '#/components/schemas/PageMeta'
    RoleCreate:
      type: object
      required:
        - name
        - user_type
        - permissions
        - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type:
            - string
            - 'null'
          maxLength: 255
        user_type:
          $ref: '#/components/schemas/UserType'
        permissions:
          $ref: '#/components/schemas/PermissionMap'
        scopes:
          $ref: '#/components/schemas/ScopeMap'
    RoleUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
            description:
              type:
                - string
                - 'null'
              maxLength: 255
            permissions:
              $ref: '#/components/schemas/PermissionMap'
            scopes:
              $ref: '#/components/schemas/ScopeMap'
    Department:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - type: object
          required:
            - name
            - is_active
            - active_user_count
          properties:
            name:
              type: string
            is_active:
              type: boolean
            active_user_count:
              type: integer
              minimum: 0
              description: Active users in the department; it can be deactivated only when this is 0.
    DepartmentPage:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Department'
        meta:
          $ref: '#/components/schemas/PageMeta'
    DepartmentCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    DepartmentUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          required:
            - name
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
    Branding:
      type: object
      required:
        - trade_name
        - logo_version
      properties:
        trade_name:
          type: string
          description: Empty until the company is configured.
        logo_version:
          type: string
          nullable: true
          description: Changes whenever the logo does; null without a logo. Use it to cache the image (`?v=`).
    Company:
      type: object
      required:
        - legal_name
        - trade_name
        - tax_id
        - address
        - phone
        - email
        - timezone
        - logo_version
        - created_at
        - updated_at
        - version
      properties:
        legal_name:
          type: string
        trade_name:
          type: string
        tax_id:
          type: string
          description: NIT.
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        timezone:
          type: string
          description: IANA time zone. Document numbers change period at midnight of this zone.
          example: America/Guatemala
        logo_version:
          type: string
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          minimum: 1
    CompanyUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          required:
            - legal_name
            - trade_name
            - tax_id
            - timezone
          properties:
            legal_name:
              type: string
              minLength: 1
              maxLength: 190
            trade_name:
              type: string
              minLength: 1
              maxLength: 190
            tax_id:
              type: string
              minLength: 1
              maxLength: 30
            address:
              type: string
              nullable: true
              maxLength: 255
            phone:
              type: string
              nullable: true
              maxLength: 40
            email:
              type: string
              format: email
              nullable: true
              maxLength: 190
            timezone:
              type: string
    Rate:
      type: string
      pattern: '^0\.\d{5}$'
      description: A rate from 0 up to (not including) 1, as a string so no float is involved. "0.12000" is 12 %.
    FinancialSettings:
      type: object
      required:
        - currency_code
        - vat_rate
        - income_tax_rate
        - stale_cost_days
        - quote_validity_days
        - created_at
        - updated_at
        - version
      properties:
        currency_code:
          type: string
          example: GTQ
          description: Read-only (P1).
        vat_rate:
          $ref: '#/components/schemas/Rate'
        income_tax_rate:
          $ref: '#/components/schemas/Rate'
        stale_cost_days:
          type: integer
          description: Days after which a product's cost counts as out of date.
        quote_validity_days:
          type: integer
          description: Days a quote stays valid.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          minimum: 1
    FinancialSettingsUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          required:
            - vat_rate
            - income_tax_rate
            - stale_cost_days
            - quote_validity_days
          properties:
            vat_rate:
              type: string
              description: Up to five decimals, from "0" to "0.99999".
              example: '0.12'
            income_tax_rate:
              type: string
              description: Up to five decimals, from "0" to "0.99999".
              example: '0.03'
            stale_cost_days:
              type: integer
              minimum: 1
              maximum: 3650
            quote_validity_days:
              type: integer
              minimum: 1
              maximum: 365
    SequencePeriod:
      type: string
      enum:
        - none
        - year
        - month
      description:
        When the counter starts again at 1. `year` writes `2026`, `month` writes `2610` (October 2026) in the
        number, for example `COT-2610-0001`.
    Sequence:
      type: object
      required:
        - code
        - name
        - prefix
        - padding
        - period
        - next_value
        - period_locked
        - example
        - updated_at
        - version
      properties:
        code:
          type: string
          example: quote
        name:
          type: string
        prefix:
          type: string
        padding:
          type: integer
          description: Minimum digits of the counter, filled with zeros.
        period:
          $ref: '#/components/schemas/SequencePeriod'
        next_value:
          type: integer
          description:
            The counter as stored. When the period has rolled over since the last number, the next document
            starts again at 1 (see `example`).
        period_locked:
          type: boolean
          description: True once a number was issued; the period can no longer change.
        example:
          type: string
          description: The number the next document will get, calculated by the server and not reserved.
          example: COT-2610-0001
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          minimum: 1
    SequenceList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Sequence'
    SequenceUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          required:
            - prefix
            - padding
            - period
            - next_value
          properties:
            prefix:
              type: string
              minLength: 1
              maxLength: 10
              description: Letters and digits; lower case is stored in upper case.
            padding:
              type: integer
              minimum: 1
              maximum: 10
            period:
              $ref: '#/components/schemas/SequencePeriod'
            next_value:
              type: integer
              minimum: 1
              description: Cannot be lower than the current counter.
