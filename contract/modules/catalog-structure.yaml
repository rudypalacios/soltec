paths:
  /v1/brands/options:
    get:
      operationId: listBrandOptions
      summary: List the active brands to choose from.
      description:
        For the selector of the forms that use this list (products). It returns only the id and the name of the active
        values, sorted by name. Any internal session may read it, so every form can fill its selectors and
        filters without any access to this section (ADR-0024). The complete list, with the inactive values, still
        needs the `view` of the section.
      tags:
        - Catalog structure
      x-permission: internal
      responses:
        '200':
          description: The active values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/brands:
    get:
      operationId: listBrands
      summary: List brands.
      description:
        Inactive values are hidden unless status says otherwise. Sorted by name. The list has no data scope; whoever may
        view it sees all its values.
      tags:
        - Catalog structure
      x-permission: brands.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: A page of brands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
    post:
      operationId: createBrand
      summary: Create a brand.
      description: The name must be unique among active values (422 `taken`).
      tags:
        - Catalog structure
      x-permission: brands.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/brands/{brandId}:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    get:
      operationId: getBrand
      summary: Get a brand by id.
      description: Returns the value, active or not.
      tags:
        - Catalog structure
      x-permission: brands.view
      responses:
        '200':
          description: The brand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      operationId: updateBrand
      summary: Edit a brand.
      description: A stale version answers 409 `conflict`; a name used by another active value, 422 `taken`.
      tags:
        - Catalog structure
      x-permission: brands.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandUpdate'
      responses:
        '200':
          description: The updated brand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/brands/{brandId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    post:
      operationId: deactivateBrand
      summary: Deactivate a brand.
      description:
        Logical deactivation. It never blocks and drags nothing along (ADR-0023). The records that use the value keep
        it, and forms offer only active values plus the one a record already had. Idempotent.
      tags:
        - Catalog structure
      x-permission: brands.deactivate
      responses:
        '200':
          description: The deactivated brand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/brands/{brandId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    post:
      operationId: reactivateBrand
      summary: Reactivate a brand.
      description: Fails with 422 `taken` if the name is now used by an active value. Idempotent.
      tags:
        - Catalog structure
      x-permission: brands.deactivate
      responses:
        '200':
          description: The reactivated brand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/areas/options:
    get:
      operationId: listAreaOptions
      summary: List the active areas to choose from.
      description:
        For the selector of the forms that use this list. It returns only the id and the name of the active values,
