  /v1/product-groups/options:
    get:
      operationId: listProductGroupOptions
      summary: List the active product groups to choose from.
      description:
        For the selector of the forms that use this list (products). It returns only the id and the name of the active
        values, sorted by name, each with the `area_id` it belongs to. Any internal session may read it, so every form can fill its selectors and
        filters without any access to this section (ADR-0024). The complete list, with the inactive values, still
        needs the `view` of the section.
      tags:
        - Catalog structure
      x-permission: internal
      responses:
        '200':
