  /v1/product-groups:
    get:
      operationId: listProductGroups
      summary: List product groups.
      description:
        Inactive values are hidden unless status says otherwise. Sorted by name. The list has no data scope; whoever may
        view it sees all its values. Filter by `area_id` to see the values of one area.
      tags:
        - Catalog structure
      x-permission: product_groups.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/AreaIdFilter'
      responses:
        '200':
          description: A page of product groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductGroupPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
    post:
      operationId: createProductGroup
      summary: Create a product group.
      description: The name must be unique among active values (422 `taken`). The area must exist and be active (422 `not_found` on `area_id`); `area_id` is required.
      tags:
        - Catalog structure
      x-permission: product_groups.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductGroupCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/product-groups/{productGroupId}:
    parameters:
      - $ref: '#/components/parameters/ProductGroupId'
    get:
      operationId: getProductGroup
      summary: Get a product group by id.
      description: Returns the value, active or not.
      tags:
        - Catalog structure
      x-permission: product_groups.view
      responses:
        '200':
          description: The product group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      operationId: updateProductGroup
      summary: Edit a product group.
      description: A stale version answers 409 `conflict`; a name used by another active value, 422 `taken`. Moving to another area needs an active one (422 `not_found`); keeping an inactive one is allowed.
      tags:
        - Catalog structure
      x-permission: product_groups.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductGroupUpdate'
      responses:
        '200':
          description: The updated product group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/product-groups/{productGroupId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/ProductGroupId'
    post:
      operationId: deactivateProductGroup
      summary: Deactivate a product group.
      description:
        Logical deactivation. It never blocks and drags nothing along (ADR-0023). The records that use the value keep
        it, and forms offer only active values plus the one a record already had. Idempotent.
      tags:
        - Catalog structure
      x-permission: product_groups.deactivate
      responses:
        '200':
          description: The deactivated product group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/product-groups/{productGroupId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/ProductGroupId'
    post:
      operationId: reactivateProductGroup
      summary: Reactivate a product group.
      description: Fails with 422 `taken` if the name is now used by an active value. Idempotent. Refused while the area is inactive (422 `parent_inactive` on `area_id`).
      tags:
        - Catalog structure
      x-permission: product_groups.deactivate
      responses:
        '200':
          description: The reactivated product group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
