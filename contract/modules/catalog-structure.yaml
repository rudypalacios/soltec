        default:
          $ref: '#/components/responses/Unexpected'
  /v1/units-of-measure:
    get:
      operationId: listUnitsOfMeasure
      summary: List units of measure.
      description:
        Inactive values are hidden unless status says otherwise. Sorted by name. The list has no data scope; whoever may
        view it sees all its values. Filter by `category_id` to see the values of one category.
      tags:
        - Catalog structure
      x-permission: units_of_measure.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/UnitCategoryIdFilter'
      responses:
        '200':
          description: A page of units of measure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitOfMeasurePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
    post:
      operationId: createUnitOfMeasure
      summary: Create a unit of measure.
      description: The name must be unique among active values (422 `taken`). The category must exist and be active (422 `not_found` on `category_id`); `category_id` is required.
      tags:
        - Catalog structure
      x-permission: units_of_measure.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitOfMeasureCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitOfMeasure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/units-of-measure/{unitOfMeasureId}:
    parameters:
      - $ref: '#/components/parameters/UnitOfMeasureId'
    get:
      operationId: getUnitOfMeasure
      summary: Get a unit of measure by id.
      description: Returns the value, active or not.
      tags:
        - Catalog structure
      x-permission: units_of_measure.view
      responses:
        '200':
          description: The unit of measure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitOfMeasure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      operationId: updateUnitOfMeasure
      summary: Edit a unit of measure.
      description: A stale version answers 409 `conflict`; a name used by another active value, 422 `taken`. Moving to another category needs an active one (422 `not_found`); keeping an inactive one is allowed.
      tags:
        - Catalog structure
      x-permission: units_of_measure.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitOfMeasureUpdate'
      responses:
        '200':
          description: The updated unit of measure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitOfMeasure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/units-of-measure/{unitOfMeasureId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UnitOfMeasureId'
    post:
      operationId: deactivateUnitOfMeasure
      summary: Deactivate a unit of measure.
      description:
        Logical deactivation. It never blocks and drags nothing along (ADR-0023). The records that use the value keep
        it, and forms offer only active values plus the one a record already had. Idempotent.
      tags:
        - Catalog structure
      x-permission: units_of_measure.deactivate
      responses:
        '200':
          description: The deactivated unit of measure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitOfMeasure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/units-of-measure/{unitOfMeasureId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/UnitOfMeasureId'
    post:
      operationId: reactivateUnitOfMeasure
      summary: Reactivate a unit of measure.
      description: Fails with 422 `taken` if the name is now used by an active value. Idempotent. Refused while the category is inactive (422 `parent_inactive` on `category_id`).
      tags:
        - Catalog structure
      x-permission: units_of_measure.deactivate
      responses:
        '200':
          description: The reactivated unit of measure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitOfMeasure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
components:
  parameters:
    BrandId:
      name: brandId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AreaId:
      name: areaId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ProductGroupId:
      name: productGroupId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UnitCategoryId:
      name: unitCategoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UnitOfMeasureId:
      name: unitOfMeasureId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AreaIdFilter:
      name: area_id
      in: query
      required: false
      description: Only the values that belong to this area.
      schema:
        $ref: '#/components/schemas/Uuid'
    UnitCategoryIdFilter:
      name: category_id
      in: query
      required: false
      description: Only the values that belong to this category.
      schema:
        $ref: '#/components/schemas/Uuid'
  schemas:
    ParameterOption:
      allOf:
        - $ref: '#/components/schemas/NamedRef'
        - type: object
          properties:
            area_id:
              description: Only for product groups, the area the group belongs to.
              $ref: '#/components/schemas/Uuid'
            category_id:
              description: Only for units of measure, the category the unit belongs to.
              $ref: '#/components/schemas/Uuid'
            color:
              type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
              description: Only for client statuses, the color of the status (`#RRGGBB`).
    ParameterOptions:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ParameterOption'
    Brand:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - type: object
          required:
            - name
            - is_active
          properties:
            name:
              type: string
            is_active:
              type: boolean
    BrandPage:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Brand'
        meta:
          $ref: '#/components/schemas/PageMeta'
    BrandCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    BrandUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          required:
            - name
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
    Area:
      allOf:
        - $ref: '#/components/schemas/RecordMeta'
        - type: object
          required:
            - name
            - is_active
            - active_group_count
          properties:
            name:
              type: string
            is_active:
              type: boolean
            active_group_count:
              type: integer
              minimum: 0
              description: Active groups under it; it can be deactivated only when this is 0.
    AreaPage:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Area'
        meta:
          $ref: '#/components/schemas/PageMeta'
    AreaCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    AreaUpdate:
      allOf:
        - $ref: '#/components/schemas/Version'
        - type: object
          required:
