paths:
  /v1/contact-types/options:
    get:
      operationId: listContactTypeOptions
      summary: List the active contact types to choose from.
      description:
        For the selector of the forms that use this list (the people of a supplier). It returns only the id and the
        name of the active values, sorted by name. Any internal session may read it, so every form can fill its
        selectors without any access to this section (ADR-0024). The complete list, with the inactive values, still
        needs `contact_types.view`.
      tags:
        - Catalog parameters
      x-permission: internal
      responses:
        '200':
          description: The active values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/contact-types:
    get:
      operationId: listContactTypes
      summary: List contact types.
      description:
        Inactive values are hidden unless status says otherwise. Sorted by name. A parameter has no data scope; whoever
        may view it sees all its values.
      tags:
        - Catalog parameters
      x-permission: contact_types.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: A page of contact types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactTypePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
    post:
      operationId: createContactType
      summary: Create a contact type.
      description: The name must be unique among active values (422 `taken`).
      tags:
        - Catalog parameters
      x-permission: contact_types.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactTypeCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/contact-types/{contactTypeId}:
    parameters:
      - $ref: '#/components/parameters/ContactTypeId'
    get:
      operationId: getContactType
      summary: Get a contact type by id.
      description: Returns the value, active or not.
      tags:
        - Catalog parameters
      x-permission: contact_types.view
      responses:
        '200':
          description: The contact type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      operationId: updateContactType
      summary: Edit a contact type.
      description: A stale version answers 409 `conflict`; a name used by another active value, 422 `taken`.
      tags:
        - Catalog parameters
      x-permission: contact_types.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactTypeUpdate'
      responses:
        '200':
          description: The updated contact type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/contact-types/{contactTypeId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/ContactTypeId'
    post:
      operationId: deactivateContactType
      summary: Deactivate a contact type.
      description:
        Logical deactivation. It never blocks and drags nothing along (ADR-0023). The records that use the value keep
        it, and forms offer only active values plus the one a record already had. Idempotent.
      tags:
        - Catalog parameters
      x-permission: contact_types.deactivate
      responses:
        '200':
          description: The deactivated contact type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/contact-types/{contactTypeId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/ContactTypeId'
    post:
      operationId: reactivateContactType
      summary: Reactivate a contact type.
      description: Fails with 422 `taken` if the name is now used by an active value. Idempotent.
      tags:
        - Catalog parameters
      x-permission: contact_types.deactivate
      responses:
        '200':
          description: The reactivated contact type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
