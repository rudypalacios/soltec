        - Catalog parameters
      x-permission: payment_methods.deactivate
      responses:
        '200':
          description: The deactivated payment method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
  /v1/payment-methods/{paymentMethodId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/PaymentMethodId'
    post:
      operationId: reactivatePaymentMethod
      summary: Reactivate a payment method.
      description: Fails with 422 `taken` if the name is now used by an active value. Idempotent.
      tags:
        - Catalog parameters
      x-permission: payment_methods.deactivate
      responses:
        '200':
          description: The reactivated payment method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Unexpected'
